include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: error
  plugins:
    - custom_lint

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
